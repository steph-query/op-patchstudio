[package]
name = "doxy"
version = "0.19.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mtp-rs = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
bytes = "1"
futures = "0.3"
sha2 = "0.10"
rfd = "0.15.4"
midir = "0.11"
nusb = "0.2.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
mtp-rs = { version = "0.13", features = ["virtual-device"] }
